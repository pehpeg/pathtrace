name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shaders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          python3 .github/check_shaders.py

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pathtrace-jar
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar

      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -e '-dev' -e '-sources' | head -n1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Automatic build of ${GITHUB_SHA::7}. Drop the jar into .minecraft/mods (Forge 1.12.2)."

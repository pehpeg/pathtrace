name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# a newer push cancels the older run, so two builds never race to publish the release
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shaders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          python3 .github/check_shaders.py

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pathtrace-jar
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar

      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -e '-dev' -e '-sources' | head -n1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Automatic build of ${GITHUB_SHA::7}. Drop the jar into .minecraft/mods (Forge 1.12.2)."

  screenshots:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri x11-xserver-utils \
            libxxf86vm1 libxrandr2 libxcursor1 libxi6 libxtst6

      - name: Play Minecraft and take screenshots
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          mkdir -p run/config out
          printf 'enabled=false\n' > run/config/splash.properties
          xvfb-run -a -s "-screen 0 1280x720x24" glxinfo -B > out/glxinfo.txt 2>&1 || true
          timeout 2400 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -Pautoshot --no-daemon > out/gradle.log 2>&1 || echo "game exited with $?"
          cp run/screenshots/*.png out/ 2>/dev/null || true
          cp run/logs/latest.log out/ 2>/dev/null || true
          # second run: fly across a normally generated world and measure stutter
          rm -f run/screenshots/*.png
          timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -Pautoshot=terrain --no-daemon > out/gradle_terrain.log 2>&1 || echo "terrain run exited with $?"
          cp run/screenshots/*.png out/ 2>/dev/null || true
          cp run/logs/latest.log out/terrain.log 2>/dev/null || true
          grep "\[terrain\]" out/terrain.log || true
          tail -n 30 out/gradle.log
          ls -la out

      - name: Publish to the screenshots branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          {
            echo "# PathTrace screenshots"
            echo
            echo "Taken automatically by CI for commit ${GITHUB_SHA::7}, using software OpenGL (llvmpipe)."
            echo
            for f in *.png; do [ -e "$f" ] && echo "## ${f%.png}" && echo && echo "![${f%.png}]($f)" && echo; done
          } > README.md
          git init -q
          git checkout -q -b screenshots
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
